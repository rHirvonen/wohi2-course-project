<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wohii Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Nunito", sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

      padding: 1rem 2rem;

      display: flex;
      justify-content: space-between;
      align-items: center;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 800;

      background: linear-gradient(90deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      letter-spacing: 1px;
    }

    #logout-btn {
      display: none;

      background: transparent;
      color: #ff6b6b;

      border: 1px solid #ff6b6b;

      padding: 0.55rem 1.2rem;

      border-radius: 999px;

      cursor: pointer;

      font-family: inherit;
      font-weight: 700;

      transition: 0.2s;
    }

    #logout-btn:hover {
      background: #ff6b6b;
      color: white;

      box-shadow: 0 0 16px rgba(255, 107, 107, 0.35);
    }

    main {
      max-width: 1300px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    #auth-section {
      max-width: 430px;
      margin: 5rem auto;

      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);

      border: 1px solid rgba(255, 255, 255, 0.08);

      border-radius: 20px;

      padding: 2.5rem;
    }

    #auth-section h2 {
      text-align: center;
      margin-bottom: 1.5rem;

      color: #ffd200;

      font-size: 1.6rem;
      font-weight: 800;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
      }
    }

    .sidebar {
      position: sticky;
      top: 100px;

      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);

      border: 1px solid rgba(255, 255, 255, 0.08);

      border-radius: 18px;

      padding: 1.4rem;
    }

    .panel h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #ffd200;
      font-weight: 800;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 0.8rem 0;

      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .leaderboard-item:last-child {
      border-bottom: none;
    }

    .leaderboard-rank {
      color: #ffd200;
      font-weight: 800;
    }

    .leaderboard-score {
      color: #51cf66;
      font-weight: 800;
    }

    .content-area {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .search-bar input {
      width: 240px;

      padding: 0.75rem 1rem;

      border-radius: 12px;

      border: 1px solid rgba(255,255,255,0.1);

      background: rgba(255,255,255,0.06);

      color: white;

      font-family: inherit;
    }

    .search-bar input:focus {
      outline: none;
      border-color: #ffd200;
    }

    .btn {
      border: none;
      cursor: pointer;

      font-family: inherit;
      font-weight: 700;

      transition: 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f7971e, #ffd200);

      color: #1a1a2e;

      padding: 0.75rem 1.3rem;

      border-radius: 12px;

      font-weight: 800;
    }

    .btn-primary:hover {
      transform: translateY(-2px);

      box-shadow: 0 4px 18px rgba(255, 210, 0, 0.3);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);

      color: white;

      border: 1px solid rgba(255,255,255,0.08);

      padding: 0.75rem 1rem;

      border-radius: 12px;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.14);
    }

    .btn-play {
      background: linear-gradient(135deg, #51cf66, #40c057);

      color: white;

      padding: 0.7rem 1.2rem;

      border-radius: 12px;

      font-weight: 800;
    }

    .btn-play:hover {
      transform: translateY(-2px);

      box-shadow: 0 4px 18px rgba(81, 207, 102, 0.3);
    }

    .difficulty-badge {
      display: inline-block;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    .difficulty-easy {
      background: rgba(81, 207, 102, 0.15);
      color: #51cf66;
    }

    .difficulty-medium {
      background: rgba(255, 212, 59, 0.15);
      color: #ffd43b;
    }

    .difficulty-hard {
      background: rgba(255, 107, 107, 0.15);
      color: #ff6b6b;
    }

    .question-card {
      background: rgba(255,255,255,0.06);

      backdrop-filter: blur(8px);

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 18px;

      padding: 1.5rem;

      transition: 0.2s;
    }

    .question-card:hover {
      transform: translateY(-3px);

      border-color: rgba(255,210,0,0.25);

      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }

    .question-card h3 {
      margin-bottom: 0.7rem;
      font-size: 1.15rem;
    }

    .question-meta {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .question-answer {
      line-height: 1.7;
      color: #ccc;
    }

    .question-actions {
      margin-top: 1.2rem;

      display: flex;
      justify-content: flex-end;
      gap: 0.7rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .form-group label {
      color: #bbb;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .form-group textarea,
    .form-group input,
    .form-group select {
      width: 100%;

      padding: 0.9rem 1rem;

      border-radius: 14px;

      border: 1px solid rgba(255,255,255,0.1);

      background: rgba(255,255,255,0.06);

      color: white;

      font-family: inherit;
      font-size: 1rem;
    }

    .form-group textarea:focus,
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #ffd200;
    }

    .play-result {
      margin-top: 1.5rem;

      padding: 1rem 1.2rem;

      border-radius: 14px;

      font-weight: 700;
    }

    .play-result.correct {
      background: rgba(81, 207, 102, 0.12);

      border: 1px solid rgba(81, 207, 102, 0.25);

      color: #51cf66;
    }

    .play-result.incorrect {
      background: rgba(255, 107, 107, 0.12);

      border: 1px solid rgba(255, 107, 107, 0.25);

      color: #ff6b6b;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;

      color: #777;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #aaa;
    }

    .error {
      color: #ff6b6b;
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>WOHII QUIZ</h1>

    <button id="logout-btn">
      Log out
    </button>
  </header>

  <main>

    <section id="auth-section" style="display:none"></section>

    <section id="app-section" style="display:none">

      <div class="app-layout">

        <aside class="sidebar">

          <div class="panel">
            <h2>Leaderboard</h2>

            <div id="leaderboard"></div>
          </div>

        </aside>

        <div class="content-area">

          <div class="toolbar">

            <button class="btn btn-primary">
              + Create Question
            </button>

            <div class="search-bar">

              <input
                type="text"
                placeholder="Search questions..."
              />

              <button class="btn btn-secondary">
                Search
              </button>

              <select id="difficulty-filter" class="btn btn-secondary">
                <option value="">All difficulties</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
              </select>

            </div>

          </div>

          <div id="questions-container"></div>

        </div>

      </div>

    </section>

  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
